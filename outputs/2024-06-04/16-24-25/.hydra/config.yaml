result_save_path_base: /Users/kabir/Documents/code/ssm_analysis/
teacher:
  _target_: utils.set_attributes
  object:
    _target_: dynamax.linear_gaussian_ssm.LinearGaussianSSM
    state_dim: 4
    emission_dim: 5
  model_name: LinearGaussianSSM_statedim${.object.state_dim}_emissiondim${.object.emission_dim}
student:
  _target_: utils.set_attributes
  object:
    _target_: dynamax.linear_gaussian_ssm.LinearGaussianSSM
    state_dim: 5
    emission_dim: 5
  model_name: LinearGaussianSSM_statedim${.object.state_dim}_emissiondim${.object.emission_dim}
num_timesteps: 10
train_trials: 10
test_trials: 1000
use_teacher_as_student: true
result_save_path: ${result_save_path_base}/results/teacher_${teacher.model_name}/student_${student.model_name}
result_save_path_if_use_teacher_as_student: ${result_save_path_base}/results/teacher_${teacher.model_name}/student_is_teacher
